
<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(128,128,128,0.1)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="450" fill="transparent" />
  <rect width="800" height="450" fill="url(#grid)" />
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-primary)" />
    </marker>
  </defs>

  <rect x="50" y="200" width="120" height="50" rx="8" fill="transparent" stroke="var(--color-muted-foreground)" stroke-width="2" />
  <text x="110" y="230" font-family="monospace" font-size="14" fill="var(--color-foreground)" text-anchor="middle">Documents</text>

  <rect x="250" y="200" width="120" height="50" rx="8" fill="transparent" stroke="var(--color-primary)" stroke-width="2" />
  <text x="310" y="230" font-family="monospace" font-size="14" fill="var(--color-foreground)" text-anchor="middle">Embeddings</text>

  <rect x="450" y="200" width="120" height="50" rx="8" fill="transparent" stroke="var(--color-primary)" stroke-width="2" />
  <text x="510" y="230" font-family="monospace" font-size="14" fill="var(--color-foreground)" text-anchor="middle">Retrieval</text>

  <rect x="650" y="200" width="100" height="50" rx="8" fill="transparent" stroke="var(--color-muted-foreground)" stroke-width="2" />
  <text x="700" y="230" font-family="monospace" font-size="14" fill="var(--color-foreground)" text-anchor="middle">LLM</text>

  <path d="M 170 225 L 250 225" stroke="var(--color-primary)" stroke-width="2" marker-end="url(#arrowhead)" />

  <path d="M 370 225 L 450 225" stroke="var(--color-primary)" stroke-width="2" marker-end="url(#arrowhead)" />

  <path d="M 570 225 L 650 225" stroke="var(--color-primary)" stroke-width="2" marker-end="url(#arrowhead)" />

</svg>
