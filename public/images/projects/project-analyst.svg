
<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(128,128,128,0.1)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="450" fill="transparent" />
  <rect width="800" height="450" fill="url(#grid)" />
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-primary)" />
    </marker>
  </defs>

  <rect x="80" y="200" width="120" height="50" rx="8" fill="transparent" stroke="var(--color-muted-foreground)" stroke-width="2" />
  <text x="140" y="230" font-family="monospace" font-size="14" fill="var(--color-foreground)" text-anchor="middle">Natural Lang</text>

  <rect x="250" y="200" width="100" height="50" rx="8" fill="transparent" stroke="var(--color-primary)" stroke-width="2" />
  <text x="300" y="230" font-family="monospace" font-size="14" fill="var(--color-foreground)" text-anchor="middle">SQL</text>

  <rect x="400" y="200" width="120" height="50" rx="8" fill="transparent" stroke="var(--color-muted-foreground)" stroke-width="2" />
  <text x="460" y="230" font-family="monospace" font-size="14" fill="var(--color-foreground)" text-anchor="middle">Data Exec</text>

  <rect x="570" y="200" width="150" height="50" rx="8" fill="transparent" stroke="var(--color-primary)" stroke-width="2" />
  <text x="645" y="230" font-family="monospace" font-size="14" fill="var(--color-foreground)" text-anchor="middle">Plotly Visualization</text>

  <path d="M 200 225 L 250 225" stroke="var(--color-primary)" stroke-width="2" marker-end="url(#arrowhead)" />

  <path d="M 350 225 L 400 225" stroke="var(--color-primary)" stroke-width="2" marker-end="url(#arrowhead)" />

  <path d="M 520 225 L 570 225" stroke="var(--color-primary)" stroke-width="2" marker-end="url(#arrowhead)" />

</svg>
